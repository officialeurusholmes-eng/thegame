<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Investigator — Case No. 1147</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #E8DFC6;
    --paper2: #f2ead6;
    --paper-shadow: #D3C6A0;
    --paper-line: #b9a877;
    --ink: #211d16;
    --ink-soft: #4a4335;
    --navy: #12151b;
    --navy-2: #1b212b;
    --navy-3: #242c38;
    --brass: #b6913f;
    --brass-bright: #d9b465;
    --stamp: #8c2a2a;
    --stamp-dark: #6e2020;
    --focus: #d9b465;
    --radius: 3px;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 0%, #1d2430 0%, transparent 55%),
      radial-gradient(ellipse at 80% 100%, #1a1f28 0%, transparent 55%),
      var(--navy);
    color: var(--paper);
    font-family: 'Crimson Pro', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  ::selection{ background: var(--brass); color: var(--navy); }

  a, button, [role="button"], select, input{ font-family: inherit; }

  button{ cursor: pointer; border: none; background: none; color: inherit; }
  button:focus-visible, .card:focus-visible, select:focus-visible{
    outline: 3px solid var(--focus); outline-offset: 2px;
  }

  .mono{ font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.03em; }
  .type{ font-family: 'Special Elite', 'IBM Plex Mono', monospace; }

  #app{ min-height: 100vh; display:flex; flex-direction:column; }

  /* ---------- svg fills / utility ---------- */
  .fill-ink{ fill: var(--ink); }
  .fill-paper{ fill: var(--paper); }
  .fill-paper2{ fill: var(--paper2); }
  .fill-navy2{ fill: var(--navy-2); }
  .fill-navy3{ fill: var(--navy-3); }
  .fill-brass{ fill: var(--brass); }
  .fill-brass-bright{ fill: var(--brass-bright); }
  .fill-stamp{ fill: var(--stamp); }
  .fill-none{ fill: none; }
  .stroke-brass{ stroke: var(--brass-bright); }
  .stroke-ink{ stroke: var(--ink); }
  .stroke-paper{ stroke: var(--paper2); }

  .glow{ animation: flicker 2.6s ease-in-out infinite; transform-origin: center; }
  .glow.slow{ animation-duration: 3.6s; }
  .glow.fast{ animation-duration: 1.6s; }
  @keyframes flicker{
    0%,100%{ opacity: 0.85; }
    45%{ opacity: 1; }
    60%{ opacity: 0.7; }
  }

  /* ---------- header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 22px;
    border-bottom: 1px solid #2b3341;
    background: linear-gradient(180deg, #171c24, #12151b);
    position: sticky; top:0; z-index: 30;
  }
  .case-id{ font-size: 12px; color: var(--brass-bright); }
  .case-id .title{ font-family: 'Special Elite', monospace; font-size: 15px; color: var(--paper); display:block; margin-top:2px; }
  .stamp-chip{
    font-family: 'Special Elite', monospace; font-size: 11px;
    border: 2px solid var(--stamp); color: var(--stamp);
    padding: 4px 10px; border-radius: 2px; transform: rotate(-3deg); letter-spacing: 0.08em;
  }

  /* ---------- generic layout ---------- */
  .stage{ flex:1; display:flex; flex-direction:column; align-items:center; padding: 32px 18px 70px; }
  .sheet{
    width: 100%; max-width: 880px;
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    box-shadow: 0 25px 60px -20px rgba(0,0,0,0.6), 0 2px 0 var(--paper-shadow) inset;
    position: relative; overflow: hidden;
    animation: sheetIn .45s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes sheetIn{
    from{ opacity: 0; transform: translateY(14px) scale(.99); }
    to{ opacity: 1; transform: translateY(0) scale(1); }
  }
  .sheet::before{
    content:""; position:absolute; inset:0;
    background-image: repeating-linear-gradient(0deg, transparent 0 27px, var(--paper-line) 28px, transparent 29px);
    opacity: 0.15; pointer-events:none;
  }
  .sheet-inner{ position:relative; padding: 34px 36px 30px; }

  h1,h2,h3{ font-family: 'Special Elite', monospace; font-weight: 400; margin: 0 0 10px; color: var(--ink); }
  h1{ font-size: 26px; }
  h2{ font-size: 19px; }
  h3{ font-size: 15px; }
  p{ line-height: 1.55; margin: 0 0 14px; }
  .lede{ font-size: 17px; }
  .fine{ font-size: 13px; color: var(--ink-soft); }
  .typewrite{ min-height: 1.2em; }
  .typewrite::after{ content:""; }

  .btn{
    display:inline-flex; align-items:center; gap:8px;
    background: var(--navy); color: var(--paper);
    padding: 11px 20px; font-family: 'Special Elite', monospace;
    font-size: 14px; letter-spacing: 0.02em; border-radius: 2px;
    box-shadow: 0 3px 0 #05070a; transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover{ transform: translateY(1px); box-shadow: 0 2px 0 #05070a; }
  .btn:active{ transform: translateY(3px); box-shadow: 0 0 0 #05070a; }
  .btn.brass{ background: var(--brass); color: #1c1400; box-shadow: 0 3px 0 #6f5322; }
  .btn.ghost{ background: transparent; color: var(--ink); box-shadow: none; border: 1.5px solid var(--ink); }
  .btn[disabled]{ opacity: 0.4; cursor: not-allowed; }
  .btn-row{ display:flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }

  /* ---------- illustrations ---------- */
  .illust{
    width: 100%; border-radius: 3px; overflow:hidden;
    border: 1.5px solid var(--paper-line);
    background: var(--navy-2);
    display:block;
    animation: illustIn .5s ease both;
  }
  .illust svg{ display:block; width:100%; height:auto; }
  @keyframes illustIn{
    from{ opacity: 0; transform: scale(1.03); }
    to{ opacity: 1; transform: scale(1); }
  }
  .illust-hero{ max-height: 220px; }
  .illust-card{ max-height: 100px; margin-bottom: 8px; }
  .illust-detail{ max-height: 240px; margin-bottom: 14px; }
  .illust-portrait{ width: 100%; max-width: 96px; border-radius: 50%; }
  .illust-portrait-lg{ width: 120px; margin: 0 auto; }

  /* ---------- COVER ---------- */
  .cover-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding: 40px 18px; perspective: 1400px; }
  .folder{ width: min(92vw, 460px); height: min(70vw, 320px); position: relative; cursor: pointer; }
  .folder-back{ position:absolute; inset:0; background:#2a1f14; border-radius: 4px 4px 10px 10px; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.7); }
  .folder-tab{ position:absolute; top:-16px; left: 24px; width: 130px; height: 26px; background:#34271a; border-radius: 4px 4px 0 0; }
  .folder-front{
    position:absolute; inset: 0; background: linear-gradient(160deg, #3a2c1c, #2a2013);
    border-radius: 4px 4px 10px 10px; transform-origin: left center;
    transition: transform .9s cubic-bezier(.6,.1,.2,1);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
  }
  .folder.open .folder-front{ transform: rotateY(-140deg); }
  .seal{ width: 96px; height: 96px; margin-bottom: 10px; }
  .folder-label{ color: var(--brass-bright); font-family:'IBM Plex Mono'; font-size: 13px; letter-spacing: 0.08em; }
  .cover-cta{ margin-top: 26px; text-align:center; }
  .cover-cta .fine{ color: #8a95a6; margin-top:10px; }

  /* ---------- HUB ---------- */
  .hub-tabs{ display:flex; gap: 4px; margin-bottom: 20px; border-bottom: 2px solid var(--ink); flex-wrap: wrap; }
  .hub-tab{ font-family: 'Special Elite', monospace; font-size: 13px; padding: 9px 16px; color: var(--ink-soft); border-radius: 3px 3px 0 0; position: relative; top:2px; }
  .hub-tab.active{ background: var(--ink); color: var(--paper); }

  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap: 14px; }

  .card{
    background: var(--paper2); border: 1.5px solid var(--paper-line);
    border-radius: 3px; padding: 14px; text-align:left;
    display:flex; flex-direction:column; gap:4px; position: relative;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{ transform: translateY(-2px); box-shadow: 0 8px 16px -8px rgba(0,0,0,0.35); }
  .card .tag{ font-family:'IBM Plex Mono'; font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.08em; }
  .card h3{ margin: 2px 0 4px; }
  .card .desc{ font-size: 13.5px; color: var(--ink-soft); margin:0; }
  .card-portrait-wrap{ display:flex; justify-content:center; margin-bottom: 4px; }
  .check{
    position:absolute; top:10px; right:10px; width: 22px; height:22px; border-radius: 50%;
    background: var(--stamp); color: var(--paper); display:flex; align-items:center; justify-content:center;
    font-size: 12px; font-family:'IBM Plex Mono'; transform: rotate(-8deg); z-index:2;
  }

  .detail{ margin-top: 18px; background: #fffdf6; border: 1.5px dashed var(--paper-line); border-radius: 3px; padding: 18px 20px; animation: sheetIn .4s ease both; }
  .detail .evidence-tag{ display:inline-block; margin-top: 10px; background: var(--stamp); color: var(--paper); font-family:'IBM Plex Mono'; font-size: 11px; padding: 3px 9px; border-radius: 2px; letter-spacing: 0.04em; }

  .suspect-head{ display:flex; gap: 14px; align-items:center; margin-bottom: 6px;}
  .qa-list{ display:flex; flex-direction:column; gap:10px; margin-top: 14px; }
  .qa-btn{ text-align:left; background: var(--paper2); border: 1.3px solid var(--paper-line); padding: 10px 14px; border-radius: 3px; font-size: 14px; display:flex; justify-content:space-between; gap: 10px; align-items:center; }
  .qa-btn:hover:not([disabled]){ background: #e9dfc0; }
  .qa-btn[disabled]{ opacity: 0.55; cursor: default; }
  .qa-btn .arrow{ font-family:'IBM Plex Mono'; font-size: 12px; }
  .answer-box{ background: #fffdf6; border-left: 3px solid var(--stamp); padding: 10px 14px; margin-top: 6px; font-size: 14px; border-radius: 0 3px 3px 0; animation: sheetIn .35s ease both; }

  /* ---------- notebook ---------- */
  .layout{ display:flex; gap: 22px; width:100%; max-width: 1180px; align-items:flex-start; }
  .main-col{ flex: 1 1 640px; min-width: 0; }
  .notebook{ flex: 0 0 300px; background: #201a12; border: 1px solid #3a2f1e; border-radius: var(--radius); padding: 18px 18px 16px; position: sticky; top: 84px; }
  .notebook h2{ color: var(--brass-bright); font-size: 15px; }
  .notebook .fine{ color: #9a8f78; margin-bottom: 12px; }
  .ev-item{ border-bottom: 1px dotted #4a3d26; padding: 9px 0; font-size: 13px; color: #e6dcc4; }
  .ev-item:last-child{ border-bottom:none; }
  .ev-item .from{ font-family:'IBM Plex Mono'; font-size: 10px; color: var(--brass-bright); text-transform:uppercase; display:block; margin-bottom:2px; letter-spacing:0.06em; }
  .ev-empty{ font-size: 13px; color: #6b6250; font-style: italic; }

  /* ---------- accusation ---------- */
  .accuse-grid{ display:grid; grid-template-columns: 1fr; gap: 18px; margin-top: 10px; }
  @media(min-width: 620px){ .accuse-grid{ grid-template-columns: 1fr 1fr 1fr; } }
  .accuse-group h3{ margin-bottom: 8px; }
  .opt{ display:block; width:100%; text-align:left; background: var(--paper2); border: 1.5px solid var(--paper-line); padding: 9px 12px; border-radius: 3px; margin-bottom: 7px; font-size: 13.5px; }
  .opt.selected{ background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .board{ display:flex; gap: 18px; flex-wrap:wrap; margin: 20px 0 6px; justify-content:center; }
  .board-card{ text-align:center; width: 96px; }
  .board-card .illust-portrait{ margin-bottom:6px; }
  .board-name{ font-size: 11px; color: var(--ink-soft); }

  /* ---------- ending ---------- */
  .ending-stamp-wrap{ position:relative; display:inline-block; margin-bottom: 14px; }
  .ending-stamp{ position:relative; z-index:2; font-family:'Special Elite', monospace; font-size: 30px; border: 4px solid var(--stamp); color: var(--stamp); display:inline-block; padding: 10px 22px; border-radius: 4px; transform: rotate(-4deg); animation: stampdown .5s ease-out; }
  @keyframes stampdown{ 0%{ transform: scale(2.4) rotate(-4deg); opacity:0;} 60%{ opacity:1;} 100%{ transform: scale(1) rotate(-4deg); opacity:1;} }
  @media (prefers-reduced-motion: reduce){
    .ending-stamp, .illust, .sheet, .detail, .answer-box{ animation: none !important; }
    .glow{ animation: none !important; }
    .folder-front{ transition: none; }
    .card, .qa-btn, .btn{ transition: none; }
  }

  .recap{ background: var(--paper2); border:1px solid var(--paper-line); border-radius:3px; padding: 14px 16px; margin-top: 18px; }
  .recap ul{ margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; }

  footer.tag{ text-align:center; padding: 16px; font-size: 11px; color: #5b6473; font-family:'IBM Plex Mono'; }

  @media (max-width: 900px){ .layout{ flex-direction: column; } .notebook{ position: static; width:100%; flex-basis: auto; order: -1; } }
  @media (max-width: 540px){ .sheet-inner{ padding: 24px 18px; } .board-card{ width: 76px; } }
</style>

  // ==================== DATA ====================

  const SCENE_CLUES = [

  const SUSPECTS = [

  const CULPRITS = SUSPECTS.map(s => ({ id: s.id, label: s.name }));
  const WEAPONS = [
    { id:'poker', label:'The fireplace poker' },
    { id:'letter_opener', label:'A letter opener' },
    { id:'candlestick', label:'A brass candlestick' },
    { id:'revolver', label:'A revolver' },
  ];
  const MOTIVES = [
    { id:'embezzlement', label:'To hide the embezzlement' },
    { id:'affair', label:'Jealousy over an affair' },
    { id:'blackmail', label:'To silence a blackmail threat' },
    { id:'debt', label:'Revenge over the will and gambling debts' },
  ];

  const SOLUTION = { culprit: 'victor', weapon: 'poker', motive: 'embezzlement' };
  const KEY_EVIDENCE_TOTAL = 7;

  // ==================== STATE ====================

  let state = initialState();
  function initialState(){
    return {
      screen: 'cover', hubTab: 'scene', openScene: null, openSuspect: null,
      examined: new Set(), asked: new Set(), evidenceLog: [],
      accusation: { culprit: null, weapon: null, motive: null },
      confirmingAccusation: false,
    };
  }

  const typedOnce = new Set();
  function reducedMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

  function typeInto(node, text, id){
    if(typedOnce.has(id) || reducedMotion()){
      node.textContent = text; typedOnce.add(id); return;
    }
    typedOnce.add(id);
    let i = 0;
    node.textContent = '';
    const timer = setInterval(() => {
      i += 2;
      node.textContent = text.slice(0, i);
      if(i >= text.length) clearInterval(timer);
    }, 12);
  }

  function keyEvidenceCount(){ return state.evidenceLog.filter(e => e.key).length; }
  function logEvidence(from, label, key){
    const already = state.evidenceLog.some(e => e.from === from && e.label === label);
    if(!already) state.evidenceLog.push({ from, label, key });
  }

  // ==================== RENDER HELPERS ====================

  function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function app(){ return document.getElementById('app'); }

  function render(){
    const root = app();
    root.innerHTML = '';
    root.appendChild(buildTopbar());

    if(state.screen === 'cover'){ root.appendChild(buildCover()); root.appendChild(buildFooter()); return; }
    if(state.screen === 'briefing'){ root.appendChild(buildBriefing()); root.appendChild(buildFooter()); return; }

    const stage = el(`<div class="stage"></div>`);
    const layout = el(`<div class="layout"></div>`);
    const mainCol = el(`<div class="main-col"></div>`);

    if(state.screen === 'hub') mainCol.appendChild(buildHub());
    if(state.screen === 'accusation') mainCol.appendChild(buildAccusation());
    if(state.screen === 'ending') mainCol.appendChild(buildEnding());

    layout.appendChild(mainCol);
    layout.appendChild(buildNotebook());
    stage.appendChild(layout);
    root.appendChild(stage);
    root.appendChild(buildFooter());
  }

  function buildTopbar(){
    const bar = el(`<div class="topbar"><div class="case-id">CASE FILE<span class="title">No. 1147 — Blackwood Manor</span></div></div>`);
    if(state.screen !== 'cover' && state.screen !== 'briefing'){
      const stamp = document.createElement('div');
      stamp.className = 'stamp-chip';
      stamp.textContent = state.screen === 'ending' ? 'CLOSED' : 'OPEN';
      bar.appendChild(stamp);
    }
    return bar;
  }

  function buildFooter(){ return el(`<footer class="tag">BLACKWOOD MANOR ESTATE — PRIVATE &amp; CONFIDENTIAL</footer>`); }

  // ---------- COVER ----------
  function buildCover(){
    const wrap = el(`
      <div class="cover-wrap">
        <div>
          <div class="folder" tabindex="0" role="button" aria-label="Open case file">
            <div class="folder-back"></div>
            <div class="folder-tab"></div>
            <div class="folder-front">
              ${ART.seal}
              <div class="folder-label">CASE NO. 1147 · BLACKWOOD MANOR</div>
            </div>
          </div>
          <div class="cover-cta">
            <p class="fine">A body in the study. Four people in the house.<br>Tap the folder to begin.</p>
          </div>
        </div>
      </div>
    `);
    const folder = wrap.querySelector('.folder');
    const openIt = () => {
      folder.classList.add('open');
      setTimeout(() => { state.screen = 'briefing'; render(); }, reducedMotion() ? 0 : 650);
    };
    folder.addEventListener('click', openIt);
    folder.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openIt(); } });
    return wrap;
  }

  // ---------- BRIEFING ----------
  function buildBriefing(){
    const stage = el(`<div class="stage"><div class="sheet"><div class="sheet-inner"></div></div></div>`);
    const inner = stage.querySelector('.sheet-inner');
    inner.appendChild(el(illust('manor', 'illust-hero')));
    inner.appendChild(el(`<h1>Blackwood Manor, 11:40 PM</h1>`));
    const p1 = el(`<p class="lede typewrite"></p>`);
    const p2 = el(`<p class="typewrite"></p>`);
    const p3 = el(`<p class="fine typewrite"></p>`);
    inner.appendChild(p1); inner.appendChild(p2); inner.appendChild(p3);
    typeInto(p1, "Edmund Blackwood — shipping magnate, host of tonight's dinner, dead in his own study. Struck once, from behind. The staff found him twenty minutes ago and the house has been sealed since.", 'brief1');
    typeInto(p2, "Four people were inside Blackwood Manor tonight: his wife, his business partner, his housekeeper, and his nephew. One of them is lying to you. Your job is to work out which — and prove it.", 'brief2');
    typeInto(p3, "Examine the study for physical evidence, then question each of the four before you name a name. You'll get one accusation. Make it count.", 'brief3');

    const row = el(`<div class="btn-row"></div>`);
    const btn = el(`<button class="btn brass">Begin the Investigation</button>`);
    btn.addEventListener('click', () => { state.screen = 'hub'; render(); });

    inner.appendChild(row);
    return stage;

  // ---------- HUB ----------
  function buildHub(){
    const sheet = el(`<div class="sheet"><div class="sheet-inner"></div></div>`);
    const inner = sheet.querySelector('.sheet-inner');

    const tabs = el(`
      <div class="hub-tabs">
        <button class="hub-tab" data-tab="scene">The Study</button>
        <button class="hub-tab" data-tab="suspects">The Suspects</button>
      </div>
    `);
    tabs.querySelectorAll('.hub-tab').forEach(b => {
      if(b.dataset.tab === state.hubTab) b.classList.add('active');
      b.addEventListener('click', () => { state.hubTab = b.dataset.tab; state.openScene=null; state.openSuspect=null; render(); });
    });
    inner.appendChild(tabs);

    if(state.hubTab === 'scene') inner.appendChild(buildScenePane());
    else inner.appendChild(buildSuspectsPane());

    const row = el(`<div class="btn-row"></div>`);
    const accuseBtn = el(`<button class="btn">Make Your Accusation →</button>`);
    accuseBtn.addEventListener('click', () => { state.screen = 'accusation'; render(); window.scrollTo(0,0); });
    row.appendChild(accuseBtn);
    inner.appendChild(row);

    return sheet;
  }

  function buildScenePane(){
    const wrap = document.createElement('div');
    wrap.appendChild(el(`<p class="fine">Choose something to examine. Each item you inspect is logged in your notebook.</p>`));
    const grid = el(`<div class="grid"></div>`);
    SCENE_CLUES.forEach(c => {
      const card = el(`
        <button class="card" aria-expanded="false">
          ${illust(c.art, 'illust-card')}
          <span class="tag">${c.tag}</span>
          <h3>${c.title}</h3>
          <p class="desc">${c.desc}</p>
        </button>
      `);
      if(state.examined.has(c.id)) card.appendChild(el(`<span class="check">✓</span>`));
      card.addEventListener('click', () => {
        state.openScene = state.openScene === c.id ? null : c.id;
        if(!state.examined.has(c.id)){ state.examined.add(c.id); logEvidence(c.title, c.evidence.label, c.evidence.key); }
        render();
      });
      grid.appendChild(card);
    });
    wrap.appendChild(grid);

    if(state.openScene){
      const c = SCENE_CLUES.find(x => x.id === state.openScene);
      const d = el(`<div class="detail"></div>`);
      d.appendChild(el(illust(c.art, 'illust-detail')));
      d.appendChild(el(`<h3>${c.title}</h3>`));
      const p = el(`<p class="typewrite"></p>`);
      d.appendChild(p);
      typeInto(p, c.text, 'scene:'+c.id);
      d.appendChild(el(`<span class="evidence-tag">Evidence logged: ${c.evidence.label}</span>`));
      wrap.appendChild(d);
    }
    return wrap;
  }

  function buildSuspectsPane(){
    const wrap = document.createElement('div');
    wrap.appendChild(el(`<p class="fine">Question each suspect. Their answers — and what they avoid saying — go in your notebook.</p>`));
    const grid = el(`<div class="grid"></div>`);
    SUSPECTS.forEach(s => {
      const askedCount = s.questions.filter(q => state.asked.has(s.id+'::'+q.id)).length;
      const card = el(`
        <button class="card">
          <div class="card-portrait-wrap"><div class="illust illust-portrait">${ART[s.art]}</div></div>
          <span class="tag">${s.role}</span>
          <h3>${s.name}</h3>
          <p class="desc">${askedCount}/${s.questions.length} questions asked</p>
        </button>
      `);
      if(askedCount === s.questions.length) card.appendChild(el(`<span class="check">✓</span>`));
      card.addEventListener('click', () => { state.openSuspect = state.openSuspect === s.id ? null : s.id; render(); });
      grid.appendChild(card);
    });
    wrap.appendChild(grid);

    if(state.openSuspect){
      const s = SUSPECTS.find(x => x.id === state.openSuspect);
      const d = el(`
        <div class="detail">
          <div class="suspect-head">
            <div class="illust illust-portrait" style="width:64px;flex-shrink:0;">${ART[s.art]}</div>
            <div>
              <h3>${s.name}</h3>
              <p class="fine" style="margin:0">${s.role} · Alibi: ${s.alibi}</p>
            </div>
          </div>
          <div class="qa-list"></div>
        </div>
      `);
      const qList = d.querySelector('.qa-list');
      s.questions.forEach(q => {
        const askedKey = s.id+'::'+q.id;
        const wasAsked = state.asked.has(askedKey);
        const qBtn = el(`<button class="qa-btn" ${wasAsked ? 'disabled' : ''}><span>${q.q}</span><span class="arrow">${wasAsked ? '✓' : '→'}</span></button>`);
        qBtn.addEventListener('click', () => {
          if(state.asked.has(askedKey)) return;
          state.asked.add(askedKey);
          logEvidence(s.name, q.label, q.key);
          render();
        });
        qList.appendChild(qBtn);
        if(wasAsked){
          const ansBox = el(`<div class="answer-box"></div>`);
          const p = el(`<span class="typewrite"></span>`);
          ansBox.appendChild(p);
          qList.appendChild(ansBox);
          typeInto(p, q.a, 'ans:'+askedKey);
        }
      });
      wrap.appendChild(d);
    }
    return wrap;
  }

  // ---------- NOTEBOOK ----------
  function buildNotebook(){
    const nb = el(`<div class="notebook"><h2>Evidence Notebook</h2><p class="fine">${state.evidenceLog.length} entries logged</p><div class="ev-list"></div></div>`);
    const list = nb.querySelector('.ev-list');
    if(state.evidenceLog.length === 0){
      list.appendChild(el(`<div class="ev-empty">Nothing logged yet. Start examining the study or questioning suspects.</div>`));
    } else {
      state.evidenceLog.forEach(e => { list.appendChild(el(`<div class="ev-item"><span class="from">${e.from}</span>${e.label}</div>`)); });
    }
    return nb;
  }

  // ---------- ACCUSATION ----------
  function buildAccusation(){
    const sheet = el(`<div class="sheet"><div class="sheet-inner"></div></div>`);
    const inner = sheet.querySelector('.sheet-inner');
    inner.appendChild(el(`<h1>Name Your Suspect</h1><p class="fine">You get one accusation. Choose the culprit, the weapon, and the motive.</p>`));

    const board = el(`<div class="board"></div>`);
    SUSPECTS.forEach(s => {
      board.appendChild(el(`
        <div class="board-card">
          <div class="illust illust-portrait">${ART[s.art]}</div>
          <div class="board-name">${s.name.split(' ')[0]}</div>
        </div>
      `));
    });
    inner.appendChild(board);

    const grid = el(`<div class="accuse-grid"></div>`);
    grid.appendChild(buildAccuseGroup('Who did it?', CULPRITS, 'culprit'));
    grid.appendChild(buildAccuseGroup('What was the weapon?', WEAPONS, 'weapon'));
    grid.appendChild(buildAccuseGroup('What was the motive?', MOTIVES, 'motive'));
    inner.appendChild(grid);

    const row = el(`<div class="btn-row"></div>`);
    const back = el(`<button class="btn ghost">← Back to the case</button>`);
    back.addEventListener('click', () => { state.screen = 'hub'; render(); });
    row.appendChild(back);

    const ready = state.accusation.culprit && state.accusation.weapon && state.accusation.motive;
    const submit = el(`<button class="btn brass" ${ready ? '' : 'disabled'}>File Accusation</button>`);
    submit.addEventListener('click', () => { if(!ready) return; if(!state.confirmingAccusation){ state.confirmingAccusation = true; render(); } });
    row.appendChild(submit);
    inner.appendChild(row);

    if(ready && state.confirmingAccusation){
      const confirmBox = el(`<div class="detail"><p><strong>This accusation is final.</strong> Once filed, the case closes — there's no revising your answer. Proceed?</p></div>`);
      const confirmRow = el(`<div class="btn-row"></div>`);
      const yes = el(`<button class="btn">Yes — close the case</button>`);
      yes.addEventListener('click', () => { state.screen = 'ending'; state.confirmingAccusation = false; render(); window.scrollTo(0,0); });
      const no = el(`<button class="btn ghost">Wait, let me reconsider</button>`);
      no.addEventListener('click', () => { state.confirmingAccusation = false; render(); });
      confirmRow.appendChild(yes); confirmRow.appendChild(no);
      confirmBox.appendChild(confirmRow);
      inner.appendChild(confirmBox);
    }

    return sheet;
  }

  function buildAccuseGroup(title, options, field){
    const group = el(`<div class="accuse-group"><h3>${title}</h3></div>`);
    options.forEach(o => {
      const opt = el(`<button class="opt">${o.label}</button>`);
      if(state.accusation[field] === o.id) opt.classList.add('selected');
      opt.addEventListener('click', () => { state.accusation[field] = o.id; state.confirmingAccusation = false; render(); });
      group.appendChild(opt);
    });
    return group;
  }

  // ---------- ENDING ----------
  function computeVerdict(){
    const { culprit, weapon, motive } = state.accusation;
    const culpritCorrect = culprit === SOLUTION.culprit;
    const weaponCorrect = weapon === SOLUTION.weapon;
    const motiveCorrect = motive === SOLUTION.motive;
    const allCorrect = culpritCorrect && weaponCorrect && motiveCorrect;
    const strongCase = keyEvidenceCount() >= 5;

    if(allCorrect && strongCase){
      return { art:'seal-big', stamp: 'SOLVED', title: 'Case Closed — Airtight',
        text: "You lay it out plainly: Victor Hale, cornered by the ledger you found and the cufflink he couldn't explain away, struck Edmund Blackwood with his own fireplace poker rather than let two years of embezzlement come to light. Marguerite's raised voices, Thomas's silhouette at the window, the unforced latch — none of it leaves room to argue. Victor's composure finally breaks. Blackwood Manor exhales. The confidential stamp goes on your report, and this time you believe it." };
    }
    if(allCorrect && !strongCase){
      return { art:'seal-big', stamp: 'SOLVED', title: 'Case Closed — But Thin',
        text: "You name Victor Hale, the poker, the embezzlement — and you're right, on every count. But your notebook is lighter than it should be. Without the fuller weight of evidence behind you, the accusation lands more as a guess that happened to be correct than a case built brick by brick. Victor confesses under pressure, more startled than caught. You got there. Next time, look a little harder before you speak." };
    }
    if(culpritCorrect && (!weaponCorrect || !motiveCorrect)){
      const detail = !weaponCorrect ? "it wasn't " + WEAPONS.find(w=>w.id===state.accusation.weapon).label.toLowerCase() : "the motive wasn't quite " + MOTIVES.find(m=>m.id===state.accusation.motive).label.toLowerCase();
      return { art:'torn', stamp:'PARTIAL', title: 'Right Man, Wrong Detail',
        text: `You name Victor Hale, and he is, in fact, guilty — his face confirms it before he says a word. But one detail in your account doesn't hold up: ${detail}. He corrects you himself, almost helpfully, on his way out in handcuffs. You solved the who. The how and the why still belonged to him.` };
    }

    const wrongName = SUSPECTS.find(s => s.id === state.accusation.culprit)?.name || 'the wrong person';
    return { art:'escape', stamp: 'COLD', title: 'Case Cold — Wrong Man',
      text: `You accuse ${wrongName}. The room goes quiet, then indignant — and rightly so. Whatever you built your case on, it wasn't enough, and it wasn't aimed at the right person. Across the room, Victor Hale straightens his collar, says nothing, and lets someone else take the fall. He'll be gone by morning, ledger and all. Somewhere in the notebook you carried tonight, the real answer was sitting in plain sight.` };
  }

  function buildEnding(){
    const sheet = el(`<div class="sheet"><div class="sheet-inner"></div></div>`);
    const inner = sheet.querySelector('.sheet-inner');
    const v = computeVerdict();

    if(v.art === 'seal-big'){
      inner.appendChild(el(`<div style="text-align:center"><div class="illust" style="width:140px;margin:0 auto 12px;background:transparent;border:none;">${ART.seal}</div></div>`));
    } else {
      inner.appendChild(el(illust(v.art, 'illust-hero')));
    }

    inner.appendChild(el(`<div style="text-align:center"><div class="ending-stamp-wrap"><div class="ending-stamp">${v.stamp}</div></div></div>`));
    inner.appendChild(el(`<h1>${v.title}</h1>`));
    const p = el(`<p class="lede typewrite"></p>`);
    inner.appendChild(p);
    typeInto(p, v.text, 'ending:'+v.title);

    const recap = el(`
      <div class="recap">
        <h3>Your Case</h3>
        <p class="fine" style="margin:0">
          Accused: <strong>${SUSPECTS.find(s=>s.id===state.accusation.culprit)?.name}</strong> ·
          Weapon: <strong>${WEAPONS.find(w=>w.id===state.accusation.weapon)?.label}</strong> ·
          Motive: <strong>${MOTIVES.find(m=>m.id===state.accusation.motive)?.label}</strong>
        </p>
        <ul>
          <li>${keyEvidenceCount()} of ${KEY_EVIDENCE_TOTAL} key pieces of evidence uncovered</li>
          <li>${state.evidenceLog.length} total entries in your notebook</li>
        </ul>
      </div>
    `);
    inner.appendChild(recap);

    const row = el(`<div class="btn-row"></div>`);
    const again = el(`<button class="btn brass">Investigate Again</button>`);
    again.addEventListener('click', () => { typedOnce.clear(); state = initialState(); state.screen = 'briefing'; render(); window.scrollTo(0,0); });
    row.appendChild(again);
    inner.appendChild(row);

    return sheet;
  }

  render();
})();
</script>
</body>
</html>
